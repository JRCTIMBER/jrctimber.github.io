name: Update site

# Runs after every change (including saves from Pages CMS), when the
# "Sold or reserved a piece" button is used in Pages CMS, and every 15 minutes
# to pick up pieces paid for online (Stripe). Scheduled runs only republish if something changed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install pillow pyyaml requests

      - name: Stock numbers, sold pieces and photos
        env:
          PAYLOAD: ${{ inputs.payload }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: python scripts/process_stock.py

      - name: Save changes
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _stock img/stock stock .stock-counter .stock-index.json .stripe-links.json stock.json google-products.xml delivery.html ebay.csv ebay.html
          if git diff --cached --quiet; then
            changed=false
          else
            changed=true
            git commit -m "Update stock"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$changed" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.save.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - if: steps.save.outputs.publish == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - if: steps.save.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
