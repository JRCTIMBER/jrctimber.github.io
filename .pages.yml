# Pages CMS set-up for JRC Timber (https://app.pagescms.org)
# Gives a phone-friendly "Stock" screen. Each piece is saved as a file in _stock/.

media:
  - name: stock
    label: Stock photos
    input: img/stock
    output: /img/stock
    rename: random
    extensions: [jpg, jpeg, png, webp]

content:
  - name: stock
    label: Stock
    type: collection
    path: _stock
    filename: "{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [ref, name, wood, list_price, price, status]
      primary: name
      sort: [ref, list_price, name]
      search: [ref, name, wood]
      default:
        sort: ref
        order: desc
    fields:
      - name: ref
        label: Stock number (from the tag)
        type: string
        description: Type the number on the tag, e.g. 25. Leave blank to get the next free number automatically about a minute after you save.
      - name: problem
        label: Problem
        type: string
        readonly: true
        description: Empty means all is fine. If a number is used twice, the piece is hidden from the shop until it's fixed.
      - name: photos
        label: Photos
        type: image
        description: Take or choose up to 6 photos. The first one is shown in the shop. They're shrunk automatically.
        options:
          media: stock
          multiple:
            max: 6
      - name: name
        label: Name
        type: string
        required: true
        description: "e.g. Character oak slab"
      - name: wood
        label: Wood
        type: select
        required: true
        options:
          values: [Oak, Walnut, Yew, Chestnut, Maple, Ash, Redwood, Elm, Cedar, Cherry, Sycamore, Beech, Hornbeam, London plane, Poplar, Other]
      - name: length
        label: Length (metres)
        type: number
        description: "e.g. 2.45"
        options:
          min: 0
          step: 0.01
      - name: width
        label: Width at widest (mm)
        type: number
        description: The widest point. This is the width used for the price.
        options:
          min: 0
      - name: width_min
        label: Width at narrowest (mm)
        type: number
        description: Leave blank if it's the same all the way along.
        options:
          min: 0
      - name: thickness
        label: Thickness (mm)
        type: number
        options:
          min: 0
      - name: dried
        label: Drying
        type: select
        options:
          values: [Air dried, Kiln dried, Fresh sawn]
      - name: finish
        label: Finish
        type: select
        required: true
        description: Rough sawn uses the unplaned prices (or green timber if Drying is Fresh sawn). The others use the planed prices.
        options:
          values: [Rough sawn, Flattened, Planed, Sanded, Finished]
      - name: edges
        label: Edges
        type: select
        default: Live edge both sides
        description: Only matters for planed pieces.
        options:
          values: [Live edge both sides, Live edge one side, Straight edges]
      - name: special
        label: Special timber (+50%)
        type: boolean
        description: Walnut always gets +50%. Tick this for other special pieces, e.g. burr or highly figured.
      - name: list_price
        label: Price from your price list (£)
        type: number
        readonly: true
        description: Worked out automatically about a minute after you save. Used unless you type your own price below.
      - name: price_working
        label: How it was worked out
        type: string
        readonly: true
      - name: price
        label: Your price (£)
        type: number
        description: Leave blank to use the price list. Type a price here to use that instead.
        options:
          min: 0
          step: 0.01
      - name: was
        label: Was price (£)
        type: number
        description: Only if it's reduced. Shows a "Reduced" tag.
        options:
          min: 0
          step: 0.01
      - name: status
        label: Status
        type: select
        description: Leave as Available for new pieces.
        options:
          values: [Available, Reserved, Sold]
      - name: note
        label: Extra details
        type: string
        description: "Optional, e.g. Ideal for resin projects"
      - name: ebay
        label: Listed on eBay
        type: boolean
        description: Tick once it's been uploaded to eBay. Unticked pieces go in the eBay file automatically (see jrctimber.github.io/ebay.html). Over 1.2m long or 50cm wide is listed as collection only.

  - name: ebay-settings
    label: eBay settings
    type: file
    path: _data/ebay.yml
    fields:
      - name: site_url
        label: Website address (used for photo links)
        type: string
      - name: location
        label: Item location shown on eBay
        type: string
      - name: postcode
        label: Postcode
        type: string
      - name: dispatch_days
        label: Dispatch time (days)
        type: number
      - name: small_max_length_m
        label: Small parcel - max length (m)
        type: number
        options:
          step: 0.01
      - name: small_max_width_mm
        label: Small parcel - max width (mm)
        type: number
      - name: small_policy
        label: Small parcel - eBay postage policy name
        type: string
      - name: medium_max_length_m
        label: Large parcel - max length (m)
        type: number
        options:
          step: 0.01
      - name: medium_max_width_mm
        label: Large parcel - max width (mm)
        type: number
      - name: medium_policy
        label: Large parcel - eBay postage policy name
        type: string
      - name: collection_policy
        label: Collection only - eBay postage policy name
        type: string

  - name: price-list
    label: Price list
    type: file
    path: _data/prices.yml
    fields:
      - {name: green_rough_sawn, label: "Green timber, rough sawn - any width (£ per m³)", type: number}
      - {name: unplaned_narrow, label: "Unplaned - narrower than the width below (£ per m³)", type: number}
      - {name: unplaned_wide, label: "Unplaned - this width and over (£ per m³)", type: number}
      - {name: unplaned_wide_from_mm, label: "Unplaned - wide price from (mm)", type: number}
      - {name: live_one_side, label: "Planed, live edge one side - up to the width below (£ per m³)", type: number}
      - {name: live_one_side_max_mm, label: "Planed, live edge one side - up to (mm)", type: number, description: "Wider pieces use the live edge both sides prices."}
      - {name: live_both_narrow, label: "Planed, live edge both sides - up to the first width (£ per m³)", type: number}
      - {name: live_both_narrow_max_mm, label: "Planed, live edge both sides - first width (mm)", type: number}
      - {name: live_both_mid, label: "Planed, live edge both sides - up to the second width (£ per m³)", type: number}
      - {name: live_both_mid_max_mm, label: "Planed, live edge both sides - second width (mm)", type: number}
      - {name: live_both_wide, label: "Planed, live edge both sides - over the second width (£ per m³)", type: number}
      - {name: straight_narrow, label: "Planed, straight edges - up to the width below (£ per m³)", type: number}
      - {name: straight_narrow_max_mm, label: "Planed, straight edges - up to (mm)", type: number}
      - {name: straight_wide, label: "Planed, straight edges - wider (£ per m³)", type: number}
      - {name: special_woods, label: "Woods that always get the special timber price", type: string, list: true}
      - {name: special_multiplier, label: "Special timber - multiply by", type: number, options: {step: 0.01}}

actions:
  - name: sold
    label: Sold or reserved a piece
    workflow: site.yml
    ref: main
    cancelable: false
    fields:
      - name: stock
        label: Stock number (e.g. JRC-025 or just 25)
        type: text
        required: true
      - name: what
        label: What's happened?
        type: select
        required: true
        default: Sold
        options: [Sold, Reserved, Available again, Remove from the site]
